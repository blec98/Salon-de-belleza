<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#d6336c" />

    <title>Belleza &amp; Estilo | Salón de Belleza en Osorno</title>
    <meta
      name="description"
      content="Belleza & Estilo — Salón de belleza profesional en Osorno. Reserva tu cita o cotiza servicios de cabello, uñas, facial, maquillaje y bienestar."
    />
    <link rel="canonical" href="https://bellezayestilo.cl/" />

    <!-- Favicon SVG -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Belleza & Estilo | Salón de Belleza en Osorno" />
    <meta
      property="og:description"
      content="Reserva tu cita o cotiza servicios profesionales de belleza en Osorno."
    />
    <meta property="og:url" content="https://bellezayestilo.cl/" />
    <meta
      property="og:image"
      content="/images/servicios/corte-cabello-dama.webp"
    />
    <meta property="og:locale" content="es_CL" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Belleza & Estilo | Salón de Belleza en Osorno" />
    <meta
      name="twitter:description"
      content="Reserva tu cita o cotiza servicios profesionales de belleza en Osorno."
    />
    <meta
      name="twitter:image"
      content="/images/servicios/corte-cabello-dama.webp"
    />

    <!-- Bootstrap 5 (Framework CSS responsive y componentes UI) -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Tema inicial: claro por defecto. Solo se aplica oscuro si el usuario
         lo eligió explícitamente con el toggle (ignora prefers-color-scheme). -->
    <script>
      (function () {
        try {
          var guardado = localStorage.getItem("tema");
          var tema = guardado === "oscuro" ? "oscuro" : "claro";
          document.documentElement.setAttribute("data-tema", tema);
        } catch (e) {
          document.documentElement.setAttribute("data-tema", "claro");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Bootstrap JS bundle (para el menú colapsable en móvil) -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      defer
    ></script>
  </body>
</html>
